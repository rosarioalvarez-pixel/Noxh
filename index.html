<!doctype html>
<html lang="es-AR">
<head>

      --accent:#ff2bd6;
      --accent2:#7c4dff;

      --logo-url: url("https://iili.io/fsDD8MJ.md.png");

    /* ====== CAMBIO: OVERLAY CON IMAGEN ====== */
    .hero-overlay{
      position:absolute; inset:0;
      background:

        </div>

          <img src="https://iili.io/fsDm82R.md.jpg" alt="Producto 4 NOXH">

        <h3>Estampa premium</h3>

<footer id="footer">

    <img class="logoImg" src="https://iili.io/fsDD8MJ.md.png" alt="NOXH Estampados logo">
